[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pph-pipeline"
dynamic = ["version"]
description = "Research pipeline for early postpartum-haemorrhage signal discovery (VitalDB stage)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "vitaldb>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
pph-pipeline = "pph_pipeline.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pph_pipeline.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
